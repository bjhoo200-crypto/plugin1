# 다른 플러그인 아이템 설정
# id       : 아이템 이름 (item_model 또는 PDC 키/값으로 비교함)
# material : 그 아이템의 실제 바닐라 재질 (레시피 틀 용도) -> 반드시 실제 재질에 맞게 수정!
items:
  steel:        { id: "machines:steel",         material: IRON_INGOT }
  steel_bolt:   { id: "machines:steel_bolt",    material: IRON_NUGGET }
  gearbox:      { id: "props:gearbox",          material: IRON_BLOCK }
  refined_oil:  { id: "machines:refined_oil",   material: BUCKET }

# false 로 두면 재질만 맞으면 통과 (id 검사 끔, 테스트용)
require-custom-id: true

cannon:
  load-seconds: 5          # 장전 시간
  max-oil: 10              # 최대 정제유(L)
  oil-per-shot: 1          # 한 발당 소모
  turn-speed-yaw: 2.0      # 좌우 회전 속도 (도/틱, 일반 시점보다 느림)
  turn-speed-pitch: 1.2    # 상하 회전 속도
  projectile-speed: 2.5
  explosion-power: 4.0     # 블럭 파괴는 항상 꺼져 있음
